spring.application.name=meusOculosApi

#Propriedades do Flyway
spring.flyway.enabled=true
spring.flyway.url=${DB_URL}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.user=${DB_USERNAME}
spring.flyway.schemas=migrations
spring.flyway.locations =classpath:db/migration/postgresql

# URL de conexão com o PostgreSQL (porta padrão 5432)
spring.datasource.url=${DB_URL}

# Credenciais do banco de dados
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver do PostgreSQL (opcional no Spring Boot moderno, mas recomendado)
spring.datasource.driver-class-name=org.postgresql.Driver

# Exibir os comandos SQL gerados no console (bom para debug)
spring.jpa.show-sql=true

# Formatar o SQL no console de forma legível
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do banco de dados (o Hibernate costuma detectar sozinho, mas pode ser fixado)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect